<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForestGuard | Monitoring</title>
    <!-- Map, Chart, & WebSocket Engines -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>🛰️ ForestGuard GS</h1>
        </div>
        <div class="status-panel">
            <span id="mission-clock" class="badge">EAT: --:--:--</span>
            <span class="badge nominal">🟢 System: NOMINAL</span>
        </div>
    </header>

    <nav class="main-nav">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html" class="active">Monitoring</a></li>
            <li><a href="control.html">Control Panel</a></li>
        </ul>
    </nav>

    <main class="dashboard-grid">
        <!-- 🌍 LIVE MAP -->
        <section class="panel map-panel">
            <div class="panel-header">🌍 Live Orbital Path</div>
            <div id="map-container"></div>
        </section>

        <!-- 📊 TELEMETRY CHART -->
        <section class="panel">
            <div class="panel-header-flex">
                <span>📊 Live Telemetry</span>
                <div class="chart-selectors">
                    <button class="chart-btn active" onclick="showChart(0)">📡 RSSI</button>
                    <button class="chart-btn" onclick="showChart(1)">🔋 Battery</button>
                    <button class="chart-btn" onclick="showChart(2)">🌡️ Temp</button>
                </div>
            </div>
            
            <div class="telemetry-stats-row">
                <span>🔋 Bat: <span id="val-battery" class="cyan">--%</span></span>
                <span>🌡️ Temp: <span id="val-temp" class="cyan">--°C</span></span>
                <span>📡 RSSI: <span id="val-rssi" class="cyan">--dBm</span></span>
            </div>

            <div id="chart-container" class="display-box chart-height"></div>
        </section>

        <!-- 🌲 SENSOR FUSION PAYLOAD -->
        <section class="panel">
            <div class="panel-header-flex">
                <span>🌲 Payload: Sensor Fusion</span>
                <div id="fire-alert" class="badge danger-alert">⚠️ FIRE DETECTED</div>
            </div>
            
            <div class="display-box fusion-viewer">
                <img id="rgb-image" src="Forest_img.jpg" class="satellite-img">
                <canvas id="thermal-canvas" width="400" height="300" class="thermal-layer"></canvas>
            </div>

            <div class="fusion-controls-container">
                <label class="control-label">Thermal Opacity Overlay</label>
                <input type="range" id="opacity-slider" min="0" max="100" value="50" class="full-width-slider">
                
                <div class="status-footer-row">
                    <span>Max Heat: <span id="thermal-max" class="cyan">--</span>°C</span>
                    <span>Forest Health: <span id="forest-health" class="health-excellent">EXCELLENT</span></span>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
