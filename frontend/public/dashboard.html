<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForestGuard | Monitoring</title>
    <!-- Map, Chart, & WebSocket Engines -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>🛰️ ForestGuard GS</h1>
        </div>
        <div class="status-panel">
            <span id="mission-clock" class="badge">EAT: --:--:--</span>
            <span class="badge nominal">🟢 System: NOMINAL</span>
        </div>
    </header>

    <nav class="main-nav">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html" class="active">Monitoring</a></li>
            <li><a href="control.html">Control Panel</a></li>
        </ul>
    </nav>

    <main class="dashboard-grid">
        <section class="panel map-panel">
            <div class="panel-header">🌍 Live Orbital Path</div>
            <div id="map-container"></div>
        </section>

        <section class="panel">
            <!-- Telemetry Header with Toggle Buttons -->
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>📊 Live Telemetry</span>
                <div class="chart-selectors">
                    <button class="chart-btn active" onclick="showChart(0)">📡 RSSI</button>
                    <button class="chart-btn" onclick="showChart(1)">🔋 Battery</button>
                    <button class="chart-btn" onclick="showChart(2)">🌡️ Temp</button>
                </div>
            </div>
            
            <!-- Live Text Readouts -->
            <div style="display: flex; justify-content: space-around; margin-bottom: 15px; font-weight: bold;">
                <span>🔋 Bat: <span id="val-battery" class="cyan">--%</span></span>
                <span>🌡️ Temp: <span id="val-temp" class="cyan">--°C</span></span>
                <span>📡 RSSI: <span id="val-rssi" class="cyan">--dBm</span></span>
            </div>

            <!-- The Chart -->
            <div id="chart-container" class="display-box" style="height: 200px;"></div>
        </section>

        <section class="panel">
            <div class="panel-header" style="display: flex; justify-content: space-between;">
                <span>🌲 Payload: Thermal Scan</span>
                <span id="fire-alert" style="color: #e74c3c; font-weight: bold; display: none;">⚠️ FIRE DETECTED</span>
            </div>
            
            <div class="display-box" style="height: 250px; background: #000; overflow: hidden;">
                <!-- This is our digital drawing board -->
                <canvas id="thermal-canvas" width="250" height="250"></canvas>
            </div>

            <!-- Mini stats for the thermal scan -->
            <div style="display: flex; justify-content: space-around; margin-top: 10px; font-size: 0.8rem;">
                <span>Max: <span id="thermal-max" class="cyan">--</span>°C</span>
                <span>Avg: <span id="thermal-avg" class="cyan">--</span>°C</span>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
